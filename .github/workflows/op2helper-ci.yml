name: OP2Helper CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [ Win32 ]
        configuration: [ Debug, Release ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Clone Outpost2DLL dependency
        run: |
          git clone --depth 1 https://github.com/OutpostUniverse/Outpost2DLL ../Outpost2DLL

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build OP2Helper
        shell: cmd
        run: |
          msbuild OP2Helper.sln /m /p:Configuration=%CONFIGURATION% /p:Platform=%PLATFORM%
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          PLATFORM: ${{ matrix.platform }}
